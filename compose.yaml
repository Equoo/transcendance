services:
  backend:
    image: forgejo.asventi.net/transcendance/backend:latest
    container_name: keepgrouped-backend
    hostname: keepgrouped-backend
    depends_on:
      database:
        condition: service_healthy
    networks:
      - frontend-backend
      - backend-database
    environment:
      # Fill password with db password
      - ConnectionStrings__DefaultConnection=Host=keepgrouped-database;Database=keepgrouped;Username=keepgrouped;Password=;
      - Storage__ServiceUrl=http://garage:3900
      - Storage__Region=garage
      - Storage__BucketName=keepgrouped-bucket
      # Fill with garage access key
      - Storage__AccessKey=

      # Fill with garage secret key
      - Storage__SecretKey=

  database:
    container_name: keepgrouped-database
    hostname: keepgrouped-database
    image: postgres:alpine
    shm_size: 128mb
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U keepgrouped" ]
      interval: 2s
      timeout: 10s
      retries: 5
      start_period: 2s

    volumes:
      - database:/db:rw
    networks:
      - backend-database
    environment:
      - POSTGRES_DB=keepgrouped
      - POSTGRES_USER=keepgrouped

      # Fille me
      - POSTGRES_PASSWORD=
      - PGDATA=/db

  garage:
    image: dxflrs/garage:v2.3.0
    command: /garage server --single-node --default-bucket
    hostname: keepgrouped-storage-dev
    environment:
      # Fill me
      GARAGE_DEFAULT_ACCESS_KEY:

      # Atleast 32 char random key
      GARAGE_DEFAULT_SECRET_KEY:
      GARAGE_DEFAULT_BUCKET: keepgrouped-bucket
      # Atleast 64 char random key
      GARAGE_RPC_SECRET:
    volumes:
      - ./garage/garage.toml:/etc/garage.toml
    networks:
      - backend-database

  frontend:
    image: forgejo.asventi.net/transcendance/frontend:latest
    container_name: keepgrouped-frontend
    hostname: keepgrouped-frontend
    depends_on:
      - backend
    networks:
      - frontend-backend
    environment:
      - API_URL=http://keepgrouped-backend:8080
    ports:
      - 4242:80

networks:
  backend-database:
    name: keepgrouped-backend-database
  frontend-backend:
    name: keepgrouped-frontend-backend

volumes:
  database:
