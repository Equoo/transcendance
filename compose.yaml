services:
  backend:
    image: forgejo.asventi.net/transcendance/backend:latest
    container_name: keepgrouped-backend
    hostname: keepgrouped-backend
    depends_on:
      - database
    networks:
      - frontend-backend
      - backend-database
    ports:
      - 4243:8080

  database:
    image: postgres:alpine
    container_name: keepgrouped-database
    hostname: keepgrouped-database
    shm_size: 128mb
    volumes:
      - database:/db:rw
    networks:
      - backend-database
    environment:
      - POSTGRES_PASSWORD=test
      - PGDATA=/db

  frontend:
    image: forgejo.asventi.net/transcendance/frontend:latest
    container_name: keepgrouped-frontend
    hostname: keepgrouped-frontend
    depends_on:
      - backend
    networks:
      - frontend-backend
    environment:
      - API_URL=http://keepgrouped-backend:8080
    ports:
      - 4242:80

  WAF:
    image: owasp/modsecurity-crs:nginx
    container_name: keepgrouped-waf
    hostname: keepgrouped-waf
    depends_on: #WAF proxies to both of thos
     - backend
     - frontend
    networks:
     - frontend-backend
    volumes:
      - ./cyber/modsecurity:/etc/modsecurity.d/custom:ro
      - ./cyber/nginx/audit:/var/log/nginx:rw
    environment:
      - MODSEC_RULE_ENGINE=On
      - PARANOIA=1
      - ANOMALY_INBOUND=5
      - ANOMALY_OUTBOUND=4
      - BACKEND=http://keepgrouped-frontend:80
      - NGINX_ALWAYS_TLS_REDIRECT=on
    ports:
     - "443:8443"
     - "80:8080"

networks:
  backend-database:
    name: keepgrouped-backend-database
  frontend-backend:
    name: keepgrouped-frontend-backend

volumes:
  database:
