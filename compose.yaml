ervices:
  backend:
    image: forgejo.asventi.net/transcendance/backend:latest
    container_name: keepgrouped-backend
    hostname: keepgrouped-backend
    depends_on:
      database:
        condition: service_healthy
    networks:
      - frontend-backend
      - backend-database
    environment:
      - ConnectionStrings__DefaultConnection=Host=keepgrouped-database;Database=keepgrouped;Username=keepgrouped;Password=changeme;

  database:
    container_name: keepgrouped-database
    hostname: keepgrouped-database
    image: postgres:alpine
    shm_size: 128mb
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U keepgrouped" ]
      interval: 2s
      timeout: 10s
      retries: 5
      start_period: 2s

    volumes:
      - database:/db:rw
    networks:
      - backend-database
    environment:
      - POSTGRES_DB=keepgrouped
      - POSTGRES_USER=keepgrouped
      - POSTGRES_PASSWORD=changeme
      - PGDATA=/db

  frontend:
    image: forgejo.asventi.net/transcendance/frontend:latest
    container_name: keepgrouped-frontend
    hostname: keepgrouped-frontend
    depends_on:
      - backend
    networks:
      - frontend-backend
    environment:
      - API_URL=http://keepgrouped-backend:8080
    ports:
      - 4242:80

networks:
  backend-database:
    name: keepgrouped-backend-database
  frontend-backend:
    name: keepgrouped-frontend-backend

volumes:
  database:
